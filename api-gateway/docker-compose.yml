services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_FILE: /app/data/store-ledger.db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    restart: unless-stopped
    volumes:
      - sqlite-data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sqlite-data:
